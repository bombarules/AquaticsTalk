name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip the newest project zip
        run: |
          newest=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Using zip: $newest"
          rm -rf PoolPlantApp
          unzip -q "$newest"
          grep -E "versionCode|versionName" PoolPlantApp/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: PoolPlantApp
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp PoolPlantApp/app/build/outputs/apk/debug/app-debug.apk AquaticsTech.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AquaticsTech-APK
          path: AquaticsTech.apk
      - name: Publish a download link on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Aquatics Tech APK (latest)
          body: Open this page on your phone, tap AquaticsTech.apk, then open the file to install. After installing, the bottom of the app home screen shows its version number.
          files: AquaticsTech.apk
          overwrite_files: true

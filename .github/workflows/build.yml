name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q PoolPlantApp.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: PoolPlantApp
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp PoolPlantApp/app/build/outputs/apk/debug/app-debug.apk PoolPlant.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PoolPlant-APK
          path: PoolPlant.apk
      - name: Publish a download link on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pool Plant APK (latest)
          body: Open this page on your phone, tap PoolPlant.apk, then open the file to install.
          files: PoolPlant.apk
